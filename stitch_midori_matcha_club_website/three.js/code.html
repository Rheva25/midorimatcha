### 1.2 Typography System
* **Display / Headings**: `Epilogue` (Google Font), sans-serif with humanist flair. Paired with italic serif accents where noted.
* **Body / UI Interface**: `Plus Jakarta Sans` or `Inter`, sans-serif.
* **Typographic Hierarchy**:
  * `Display Hero H1`: `text-5xl md:text-7xl font-light tracking-tight text-content-primary leading-[1.08]` (supports italic emphasis span: `font-serif italic font-normal text-midori`)
  * `Section H2`: `text-3xl md:text-5xl font-light md:font-normal tracking-tight leading-tight`
  * `Card / Sub-title H3`: `text-xl md:text-2xl font-medium tracking-tight`
  * `Eyebrow / Badge`: `text-xs font-semibold tracking-widest uppercase text-midori`
  * `Body Lead`: `text-lg md:text-xl text-content-secondary leading-relaxed font-normal`
  * `Body Regular`: `text-base text-content-secondary leading-relaxed`
  * `Metadata / Small`: `text-xs md:text-sm text-content-muted uppercase tracking-wider`

### 1.3 Radii & Elevation Rules
* **Interactive Actions / Pills**: `rounded-full` (`9999px`) — Navbar items, buttons, category chips, status pills.
* **Form Inputs & Interactive Fields**: `rounded-2xl` (`16px / 1rem`) — Inputs, textareas, selects.
* **Content Cards & Media Sheets**: `rounded-3xl` (`24px / 1.5rem` to `32px / 2rem`) — Teahouse cards, menu cards, article cards.
* **Shadows & Elevation**:
  * Subtle Card: `shadow-[0_4px_24px_rgba(26,32,22,0.04)]`
  * Elevated Hover: `hover:shadow-[0_12px_36px_rgba(26,32,22,0.08)] transition-all duration-300`
  * Modal Backdrop: `bg-content-primary/60 backdrop-blur-sm`
  * Glass Nav: `bg-surface-cream/80 backdrop-blur-md border-b border-surface-dim/40`

## 02 — GLOBAL COMPONENTS (`/components/global/`)

### 2.1 `Navbar.tsx`
* **Visual Spec**: Sticky glassmorphism header (`h-20`), z-50, travertine tone with subtle lower border.
* **Props**:
  ```typescript
  interface NavbarProps {
    currentRoute: '/' | '/menu' | '/cart' | '/story' | '/locations' | '/journal' | '/contact';
    cartCount?: number;
    onOpenMobileMenu?: () => void;
  }
  ```
* **Inner Elements**:
  1. **Brand Mark**: Stylized ceremonial bowl icon + `MIDORI MATCHA CLUB` typography (`/`).
  2. **Desktop Navigation Links** (6 routes):
     * `Home` (`/`)
     * `Menu` (`/menu`)
     * `Our Story` (`/story`)
     * `Locations` (`/locations`)
     * `Journal` (`/journal`)
     * `Contact` (`/contact`)
     * *Active Route State*: Pill container `rounded-full bg-midori text-white px-4 py-1.5 font-medium text-sm`. Inactive routes: `text-content-secondary hover:text-content-primary transition-colors`.
  3. **Right Action Utility**:
     * **Shopping Bag Button**: Lucide `ShoppingBag` with counter badge (`bg-midori text-white text-xs rounded-full w-5 h-5 flex items-center justify-center font-bold`).
     * **Order Now CTA**: Pill button `rounded-full bg-midori-dark text-white px-5 py-2 text-sm font-medium hover:bg-midori transition-colors`.
     * **Mobile Hamburger**: Lucide `Menu` (hidden on `md:hidden`).

### 2.2 `Footer.tsx`
* **Visual Spec**: Full-width footer in `#F6F4EC` or `#23331C` variant.
* **Standardized Sections**:
  1. **Brand Statement**: *"Slow harvested, single-origin ceremonial green tea for contemporary rituals."*
  2. **Authoritative Sanctuary Locations**:
     * `Senopati Flagship` (Jl. Senopati No. 45, Jakarta Selatan)
     * `BSD City Lakefront` (The Breeze BSD, Tangerang)
     * `Royal Baroe Serang` (Jl. Veteran No. 12, Kota Serang)
  3. **Directory Navigation**: Two columns of structured text links (*Collection* & *House*).
  4. **Newsletter Mini-Form**: Travertine input (`rounded-full`) with `Subscribe` pill.
  5. **Legal & Social**: Copyright 2025 Midori Matcha Club, Privacy Policy, Terms, IG/TikTok/Pinterest links.

### 2.3 `Button.tsx`
* **Variants**:
  * `primary`: `rounded-full bg-midori-dark text-white hover:bg-midori px-7 py-3.5 text-sm font-medium transition-all shadow-sm`
  * `secondary`: `rounded-full bg-transparent border border-midori-dark/30 text-midori-dark hover:border-midori-dark hover:bg-midori-dark/5 px-7 py-3.5 text-sm font-medium`
  * `accent`: `rounded-full bg-midori text-white hover:bg-midori-hover px-6 py-3 text-sm font-medium`
  * `ghost`: `text-content-primary hover:text-midori font-medium text-sm flex items-center gap-1.5`

## 04 — COMMERCE & PAYMENT FLOW SPECIFICATION (`/components/commerce/`)

### 4.1 `CartDrawer.tsx` / `/cart` Page Component
* **Line Items Anatomy**:
  * Product Thumbnail: `w-20 h-20 rounded-2xl object-cover bg-surface-sand`
  * Description: Item Name, Cultivar, Ice/Sweetness selections.
  * Stepper Controls: Quantity `[-] 1 [+]` in `rounded-full bg-surface-muted px-3 py-1 flex items-center gap-3`
  * Price: Subtotal per item formatted in `Rp`.
  * Delete Trigger: Lucide `Trash2` icon button.
* **Order Summary Card**:
  * Subtotal, Service / Cup Fee, Local Courier Delivery estimate.
  * Total Price in high-contrast `text-2xl font-semibold text-content-primary`.
  * Checkout CTA: `Proceed to Payment` triggering modal flow.

### 4.2 Modal Payment Engine (`PaymentModal.tsx`)
* **State Machine**:
  * `paymentMethod`: `'QRIS' | 'VA' | 'CC'`
  * `modalState`: `'SELECTION' | 'CONFIRMATION' | 'SUCCESS'`
* **Screen 04A (QRIS Modal)**:
  * Dynamic generated QR Code box (`w-56 h-56 mx-auto bg-white p-4 rounded-2xl shadow-inner border border-surface-dim`).
  * Real-time countdown timer (e.g., `14:59` expiring countdown).
  * Auto-checking polling simulator: *"Waiting for QRIS scan..."*
* **Screen 04B (Virtual Account Modal)**:
  * Bank Select Chips (BCA, Mandiri, BNI, BRI).
  * 16-digit Virtual Account Number with one-click `Copy` button (`rounded-full bg-surface-muted px-4 py-2`).
  * Step-by-step ATM / m-Banking transfer accordion instructions.
* **Screen 04C (Credit Card Modal)**:
  * Form inputs styled in `rounded-2xl`: Card Number, Expiration MM/YY, CVV, Cardholder Name.
  * 3D Secure / Verified by Visa security badge in footer.

  * Action Buttons = `rounded-full` (9999px pill)

## 08 — RESPONSIVE ADAPTATION MATRIX

| Component | Mobile (320px – 767px) | Tablet (768px – 1023px) | Desktop (1024px+) |
|---|---|---|---|
| **Global Navbar** | Compact logo + Cart pill + Hamburger trigger (`SlideOverDrawer`) | Standard logo + links + Cart pill + Order CTA | Full 6-link bar with active indicator + Cart + CTA |
| **Editorial Hero** | Stacked single column (Text first, Image `aspect-[4/3]`) | 2-column balanced split | 50/50 editorial split with large typography |
| **Menu Card Grid** | 1 column or 2-column compact cards | 2 columns with expanded tags | 3 to 4-column balanced grid |
| **Sanctuary Cards** | 1 column vertical sequence with scrollable pills | 2 columns | 3-column comparative sanctuary cards |
| **Java Sanctuary Map** | Scrollable SVG viewport or vertical node accordion | Full-width scaled vector map | Interactive SVG with live pin hover states |
| **Journal Grid** | 1 column stacked cards | 2-column asymmetric grid | 3-column editorial grid |
| **Payment Modals** | Bottom sheet drawer pattern for thumb accessibility | Centered floating dialog (`max-w-md`) | Centered floating dialog (`max-w-md`) |
| **Closing CTA Banner** | Vertical stacked buttons (`w-full`) | Horizontal buttons | Horizontal side-by-side CTA buttons |
